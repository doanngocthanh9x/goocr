syntax = "proto3";

package datatransfer;

import "common.proto";

option go_package = "github.com/doanngocthanh9x/goocr/gen/datatransfer";

// Service định nghĩa các RPC methods
service DataTransferService {
  // Nhận file và xử lý
  rpc ProcessFile(stream FileChunk) returns (ProcessFileResponse) {}
  
  // Nhận JSON và xử lý
  rpc ProcessJson(JsonRequest) returns (JsonResponse) {}
}

// Message cho file streaming
message FileChunk {
  string filename = 1;
  bytes data = 2;
  int32 chunk_index = 3;
  int32 total_chunks = 4;
  common.Metadata metadata = 5;
}

// Message response sau khi xử lý file
message ProcessFileResponse {
  common.ProcessingStatus status = 1;
  string result = 2;
  map<string, string> data = 3;
}

// Message request JSON
message JsonRequest {
  string json_data = 1;
  common.Metadata metadata = 2;
}

// Message response JSON
message JsonResponse {
  common.ProcessingStatus status = 1;
  string result = 2;
  map<string, string> data = 3;
}
